#  Browser Configuration
# Which browser engine to use: CHROMIUM | FIREFOX | EDGE
browser.type=CHROMIUM

# Run browser without a visible window (true = CI-friendly, false = watch it run)
browser.headless=true

# Slow every Playwright action by N milliseconds ? great for debugging
browser.slow-mo=0

# Viewport size in pixels
browser.viewport.width=1920
browser.viewport.height=1080

# Leave blank for Chromium; set to "msedge" or "chrome" for those channels
browser.channel=

#  Application Under Test
# Base URL page.navigate("/login") resolves to https://opensource-demo.orangehrmlive.com/login
app.base-url=https://opensource-demo.orangehrmlive.com
app.default-timeout=30000

#  Evidence Collection
trace.enabled=true
screenshot.on-failure=true
screenshot.path=target/screenshots

#  Test Data
# Never hardcode credentials in step definitions ? inject via @Value
test-data.valid-admin-username=Admin
